name: Live Forecast Refresh

on:
  workflow_dispatch:

  schedule:
    # 9:00 AM Bangladesh time = 3:00 AM UTC
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  refresh-live-forecast:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # Checkout Repository
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # Setup Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # Install Dependencies
      # ======================================================
      
      - name: Install project dependencies
        run: |
          pip install -r requirements.txt
          pip install \
            pandas \
            numpy \
            requests \
            beautifulsoup4 \
            lxml \
            holidays \
            scikit-learn \
            joblib \
            python-dotenv \
            mlflow \
            dagshub \
            dvc \
            dvc-http \
            xgboost


      # ======================================================
      # MLflow Environment
      # ======================================================

      - name: Configure MLflow environment
        run: |
          echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_TRACKING_USERNAME }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }}" >> $GITHUB_ENV


      # ======================================================
      # Configure DVC Authentication
      # ======================================================

      - name: Configure DVC remote authentication
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "${{ secrets.DAGSHUB_USERNAME }}"
          dvc remote modify origin --local password "${{ secrets.DAGSHUB_TOKEN }}"


      # ======================================================
      # Pull Existing DVC Data
      # ======================================================

      - name: Pull DVC data
        run: |
          dvc pull -r origin


      # ======================================================
      # Run Live Forecast Refresh Pipeline
      # ======================================================

      - name: Refresh live forecasts
        run: |
          python -m src.pipeline.refresh_live_forecasts


      # ======================================================
      # Update DVC Raw Data Tracking
      # ======================================================

      - name: Update DVC tracked raw data
        run: |
          dvc add data/raw/area_wise_demand.csv
          dvc add data/raw/dhaka_weather.csv
          dvc add data/processed/bridge_forecast.csv
          dvc add data/processed/regional_bridge_forecast.csv


      # ======================================================
      # Reproduce DVC Pipeline
      # ======================================================

      - name: Reproduce DVC pipeline
        run: |
          dvc repro


      # ======================================================
      # Push Data to DVC Remote
      # ======================================================

      - name: Push updated DVC data
        run: |
          dvc push -r origin


      # ======================================================
      # Verify DVC
      # ======================================================

      - name: Check DVC status
        run: |
          dvc status


      # ======================================================
      # Commit Updated Metadata
      # ======================================================

      - name: Commit refreshed metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/area_wise_demand.csv.dvc
          git add data/raw/dhaka_weather.csv.dvc
          git add dvc.lock

          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
          else
            git commit -m "chore: refresh live forecast data"
            git push origin main
          fi


      # ======================================================
      # Final Verification
      # ======================================================

      - name: Final status
        run: |
          echo "=============================="
          echo "Git Status"
          echo "=============================="
          git status --short

          echo ""

          echo "=============================="
          echo "DVC Status"
          echo "=============================="
          dvc status