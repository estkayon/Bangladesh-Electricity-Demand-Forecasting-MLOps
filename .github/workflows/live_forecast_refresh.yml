name: Live Forecast Refresh

on:
  workflow_dispatch:

  schedule:
    # Bangladesh time 9:00 AM = UTC 3:00 AM
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  refresh-live-forecast:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # Checkout Repository
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # Install Dependencies
      # ======================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install \
              pandas \
              numpy \
              requests \
              beautifulsoup4 \
              lxml \
              holidays \
              scikit-learn \
              joblib \
              python-dotenv \
              mlflow \
              dagshub \
              dvc \
              dvc-http
          fi


      # ======================================================
      # Environment Variables
      # ======================================================

      - name: Configure environment
        run: |
          echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_TRACKING_USERNAME }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }}" >> $GITHUB_ENV


      # ======================================================
      # DVC Remote Authentication
      # ======================================================

      - name: Configure DVC remote authentication
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "${{ secrets.DAGSHUB_USERNAME }}"
          dvc remote modify origin --local password "${{ secrets.DAGSHUB_TOKEN }}"


      # ======================================================
      # Pull Current DVC Data
      # ======================================================

      - name: Pull DVC data
        run: |
          dvc pull -r origin


      # ======================================================
      # Run Live Forecast Pipeline
      # ======================================================

      - name: Refresh live forecasts
        run: |
          python -m src.pipeline.refresh_live_forecasts


      # ======================================================
      # Update Raw DVC Files
      # ======================================================

      - name: Update DVC tracked raw data
        run: |
          dvc add data/raw/area_wise_demand.csv
          dvc add data/raw/dhaka_weather.csv


      # ======================================================
      # Reproduce DVC Pipeline
      # ======================================================

      - name: Reproduce DVC pipeline
        run: |
          dvc repro


      # ======================================================
      # Push DVC Data
      # ======================================================

      - name: Push updated DVC data
        run: |
          dvc push -r origin


      # ======================================================
      # Show Status
      # ======================================================

      - name: Show DVC status
        run: |
          dvc status


      # ======================================================
      # Commit Updated Metadata
      # ======================================================

      - name: Commit refreshed data metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/raw/area_wise_demand.csv.dvc \
            data/raw/dhaka_weather.csv.dvc \
            dvc.lock \
            data/raw/missing_dates.csv

          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
          else
            git commit -m "chore: refresh live electricity forecast data"
            git push origin main
          fi


      # ======================================================
      # Final Verification
      # ======================================================

      - name: Final status
        run: |
          echo "Git status:"
          git status --short

          echo ""
          echo "DVC status:"
          dvc status